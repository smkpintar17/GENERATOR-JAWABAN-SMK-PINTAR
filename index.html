<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator & Penilaian Jawaban Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <h1>REKAP & PENILAIAN JAWABAN SISWA</h1>
            <p>Isi nama dan 10 jawaban di bawah untuk melakukan koreksi otomatis dan simpan JPG</p>
        </header>

        <!-- CONTENT LAYOUT -->
        <main class="content-wrapper">
            
            <!-- FORM INPUT -->
            <section class="card form-section">
                <h2>Form Data & Jawaban</h2>
                <form id="quizForm">
                    <div class="form-group">
                        <label for="namaSiswa">Nama Peserta Didik</label>
                        <input type="text" id="namaSiswa" placeholder="Masukkan nama lengkap..." required>
                    </div>

                    <div class="answers-grid">
                        <!-- 10 Input Jawaban -->
                        <div class="form-group">
                            <label for="j1">1. Bagaimana HTML membentuk struktur mendasar dari sebuah halaman web dan mengapa pemilihan elemen semantik penting?</label>
                            <textarea id="j1" class="ans-input" rows="3" placeholder="Jawaban 1"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j2">2. Bagaimana CSS mempengaruhi aspek visual dan kegunaan (usability) antarmuka pengguna?</label>
                            <textarea id="j2" class="ans-input" rows="3" placeholder="Jawaban 2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j3">3. Jelaskan peran JavaScript dalam mengubah dokumen statis menjadi aplikasi interaktif.</label>
                            <textarea id="j3" class="ans-input" rows="3" placeholder="Jawaban 3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j4">4. Bagaimana skenario manipulasi DOM menggunakan JavaScript yang pernah Anda terapkan?</label>
                            <textarea id="j4" class="ans-input" rows="3" placeholder="Jawaban 4"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j5">5. Mengapa kontrol versi seperti Git/GitHub sangat krusial dalam siklus pengembangan perangkat lunak?</label>
                            <textarea id="j5" class="ans-input" rows="3" placeholder="Jawaban 5"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j6">6. Jelaskan perbedaan fungsi utama antara perintah `git commit` dan `git push`.</label>
                            <textarea id="j6" class="ans-input" rows="3" placeholder="Jawaban 6"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j7">7. Bagaimana platform seperti Vercel mempermudah proses enkapsulasi dan integrasi Continuous Deployment (CD)?</label>
                            <textarea id="j7" class="ans-input" rows="3" placeholder="Jawaban 7"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j8">8. Bagaimana alur kerja lengkap saat Anda memperbarui kode lokal hingga perubahan muncul otomatis di domain Vercel?</label>
                            <textarea id="j8" class="ans-input" rows="3" placeholder="Jawaban 8"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j9">9. Tantangan teknis apa yang paling sering Anda hadapi saat mengintegrasikan HTML, CSS, JS dengan GitHub dan Vercel?</label>
                            <textarea id="j9" class="ans-input" rows="3" placeholder="Jawaban 9"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="j10">10. Strategi atau perbaikan apa yang akan Anda terapkan pada proyek web dev berikutnya berdasarkan pengalaman ini?</label>
                            <textarea id="j10" class="ans-input" rows="3" placeholder="Jawaban 10"></textarea>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button type="button" id="btnPreview" class="btn btn-primary">Hitung Nilai & Preview</button>
                        <button type="button" id="btnDownload" class="btn btn-secondary">Download (JPG)</button>
                    </div>
                </form>
            </section>

            <!-- CANVAS PREVIEW -->
            <section class="card preview-section">
                <h2>Preview Gambar + Nilai (JPG)</h2>
                <div class="canvas-wrapper">
                    <!-- Canvas HTML5 untuk merender hasil gambar JPG -->
                    <canvas id="resultCanvas" width="850" height="1100"></canvas>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
